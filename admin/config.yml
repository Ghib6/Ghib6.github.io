backend:
  name: github
  repo: Ghib6/Blog
  branch: master
  # Replace this with the deployed OAuth proxy URL, then uncomment both lines.
  base_url: https://blog-cms-oauth-dusky.vercel.app
  auth_endpoint: api/auth

locale: zh_Hans
publish_mode: editorial_workflow
site_url: https://www.ghib6.com
display_url: https://www.ghib6.com

# Decap CMS requires a media folder. This project keeps real images in Ghib6/pic_bed,
# so article image fields below are URL fields that should use picbed.ghib6.com links.
media_folder: source/admin/.decap-media
public_folder: /admin/.decap-media

collections:
  - name: posts
    label: 文章
    label_singular: 文章
    folder: source/_posts
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: md
    format: frontmatter
    preview_path: "{{year}}/{{month}}/{{day}}/{{slug}}/"
    sortable_fields:
      - date
      - updated
      - title
    fields:
      - label: 标题
        name: title
        widget: string
      - label: 摘要
        name: description
        widget: text
        required: false
      - label: 发布时间
        name: date
        widget: datetime
        format: "YYYY-MM-DD HH:mm:ss"
        date_format: "YYYY-MM-DD"
        time_format: "HH:mm:ss"
      - label: 更新时间
        name: updated
        widget: datetime
        format: "YYYY-MM-DD HH:mm:ss"
        date_format: "YYYY-MM-DD"
        time_format: "HH:mm:ss"
        required: false
      - label: 分类
        name: categories
        widget: list
        required: false
        field:
          label: 分类名
          name: category
          widget: string
      - label: 标签
        name: tags
        widget: list
        required: false
        field:
          label: 标签名
          name: tag
          widget: string
      - label: 轮播权重
        name: swiper_index
        widget: number
        value_type: int
        min: 0
        required: false
      - label: 封面图床链接
        name: cover
        widget: string
        required: false
        hint: "填写 pic_bed 外链，例如 https://picbed.ghib6.com/img/touxiang.jpg"
      - label: 顶部图床链接
        name: top_img
        widget: string
        required: false
        hint: "填写 pic_bed 外链，例如 https://picbed.ghib6.com/img/touxiang.jpg"
      - label: 正文
        name: body
        widget: markdown

  - name: navigation
    label: 导航栏
    files:
      - file: source/_data/navigation.yml
        label: 导航配置
        name: navigation_file
        fields:
          - label: 导航项
            name: items
            widget: list
            summary: "{{fields.icon}} {{fields.name}}"
            fields:
              - label: 导航名称
                name: name
                widget: string
              - label: 图标
                name: icon
                widget: string
                required: false
                hint: 例如 fa fa-home
              - label: 链接
                name: link
                widget: string
                required: false
                hint: 父级可留空（如仅作为子菜单分组），例如 /archives/
              - label: 子菜单
                name: children
                widget: list
                required: false
                summary: "{{fields.icon}} {{fields.name}}"
                fields:
                  - label: 子菜单名称
                    name: name
                    widget: string
                  - label: 图标
                    name: icon
                    widget: string
                    required: false
                  - label: 链接
                    name: link
                    widget: string
                    hint: 建议填写站内路径，例如 /music/

  - name: site_settings
    label: 站点设置
    files:
      - name: hexo_config
        label: 站点基础信息（_config.yml）
        file: _config.yml
        fields:
          - label: 标题
            name: title
            widget: string
          - label: 副标题
            name: subtitle
            widget: string
            required: false
          - label: 描述
            name: description
            widget: text
            required: false
          - label: 关键词
            name: keywords
            widget: string
            required: false
          - label: 作者
            name: author
            widget: string
            required: false
          - label: 站点地址
            name: url
            widget: string

      - name: butterfly_config
        label: Butterfly 主题信息（_config.butterfly.yml）
        file: _config.butterfly.yml
        fields:
          - label: 网站 Favicon
            name: favicon
            widget: string
            required: false
            hint: "请先通过图床上传按钮上传图片，然后把返回的 https://picbed.ghib6.com/img/xxx.png 链接填入这里。"
          - label: 头像
            name: avatar
            widget: object
            fields:
              - label: 头像图片
                name: img
                widget: string
                required: false
                hint: "请先通过图床上传按钮上传图片，然后把返回的 https://picbed.ghib6.com/img/xxx.png 链接填入这里。"
              - label: 头像特效
                name: effect
                widget: boolean
                required: false
          - label: 首页顶部图
            name: index_img
            widget: string
            required: false
            hint: "请先通过图床上传按钮上传图片，然后把返回的 https://picbed.ghib6.com/img/xxx.png 链接填入这里。"
          - label: 默认顶部图
            name: default_top_img
            widget: string
            required: false
            hint: "请先通过图床上传按钮上传图片，然后把返回的 https://picbed.ghib6.com/img/xxx.png 链接填入这里。"
          - label: 背景图
            name: background
            widget: string
            required: false
            hint: "请先通过图床上传按钮上传图片，然后把返回的 https://picbed.ghib6.com/img/xxx.png 链接填入这里。"
          - label: 作者卡片
            name: aside
            widget: object
            fields:
              - label: 作者卡片
                name: card_author
                widget: object
                fields:
                  - label: 描述
                    name: description
                    widget: text
                    required: false
                  - label: 按钮
                    name: button
                    widget: object
                    fields:
                      - label: 按钮文字
                        name: text
                        widget: string
                        required: false
                      - label: 按钮链接
                        name: link
                        widget: string
                        required: false
              - label: 公告卡片
                name: card_announcement
                widget: object
                fields:
                  - label: 启用公告
                    name: enable
                    widget: boolean
                    required: false
                  - label: 公告内容
                    name: content
                    widget: markdown
                    required: false
